<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ title|default("Dashboard Despeses - iPad") }}</title>
    <style>
        * { box-sizing: border-box; -webkit-box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            padding-bottom: 40px;
            font-size: 16px;
        }
        .header {
            background-color: #1e293b;
            border-bottom: 2px solid #334155;
            padding: 12px 20px;
            display: -webkit-flex;
            display: flex;
            -webkit-justify-content: space-between;
            justify-content: space-between;
            -webkit-align-items: center;
            align-items: center;
        }
        .header h1 {
            font-size: 20px;
            color: #f39c12;
            font-weight: 700;
        }
        .header-sub {
            font-size: 13px;
            color: #94a3b8;
        }
        .nav-bar {
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            padding: 8px 15px;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .nav-link {
            display: inline-block;
            padding: 10px 16px;
            margin-right: 8px;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            background-color: #0f172a;
            border: 1px solid #334155;
            font-size: 15px;
        }
        .nav-link.active, .nav-link:active {
            background-color: #f39c12;
            color: #0f172a;
            border-color: #f39c12;
        }
        .container {
            max-width: 1024px;
            margin: 0 auto;
            padding: 15px;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 18px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
            color: #f39c12;
            margin-bottom: 12px;
            display: block;
        }
        .grid-2 {
            display: -webkit-flex;
            display: flex;
            -webkit-flex-wrap: wrap;
            flex-wrap: wrap;
            margin: -6px;
        }
        .grid-col {
            -webkit-flex: 1;
            flex: 1;
            min-width: 260px;
            padding: 6px;
        }
        .grid-4 {
            display: -webkit-flex;
            display: flex;
            -webkit-flex-wrap: wrap;
            flex-wrap: wrap;
            margin: -6px;
        }
        .grid-col-4 {
            -webkit-flex: 1;
            flex: 1;
            min-width: 200px;
            padding: 6px;
        }
        .kpi-box {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            margin-bottom: 6px;
        }
        .kpi-title {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .kpi-val {
            font-size: 22px;
            font-weight: bold;
        }
        .text-green { color: #10b981; }
        .text-red { color: #ef4444; }
        .text-orange { color: #f39c12; }
        .text-blue { color: #38bdf8; }
        .text-muted { color: #64748b; }
        
        table.retro-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        table.retro-table th {
            background-color: #0f172a;
            color: #94a3b8;
            text-align: left;
            padding: 10px 8px;
            border-bottom: 2px solid #334155;
            font-weight: 600;
        }
        table.retro-table td {
            padding: 10px 8px;
            border-bottom: 1px solid #334155;
            color: #e2e8f0;
        }
        table.retro-table tr:hover {
            background-color: #273549;
        }
        
        /* Form inputs styled for touch on iPad */
        .form-group {
            margin-bottom: 15px;
        }
        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 600;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #ffffff;
            border-radius: 8px;
            font-size: 16px;
            -webkit-appearance: none;
            outline: none;
        }
        .form-control:focus {
            border-color: #f39c12;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            background-color: #f39c12;
            color: #0f172a;
            font-weight: bold;
            font-size: 17px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            -webkit-appearance: none;
        }
        .btn:active {
            background-color: #d97706;
        }
        .btn-secondary {
            background-color: #334155;
            color: #ffffff;
        }
        .alert {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .alert-success {
            background-color: #064e3b;
            color: #6ee7b7;
            border: 1px solid #059669;
        }
        .alert-danger {
            background-color: #7f1d1d;
            color: #fca5a5;
            border: 1px solid #dc2626;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-income { background-color: #064e3b; color: #6ee7b7; }
        .badge-expense { background-color: #7f1d1d; color: #fca5a5; }
        .badge-bank { background-color: #1e3a8a; color: #93c5fd; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>📊 Dashboard Despeses</h1>
            <div class="header-sub">Versió lleugera optimitzada per a iPad 2 (iOS 9)</div>
        </div>
        <div>
            <span style="font-size: 13px; color: #10b981; font-weight: bold;">● Supabase Online</span>
        </div>
    </div>
    
    <div class="nav-bar">
        <a href="/" class="nav-link {% if active_page == 'resum' %}active{% endif %}">🏠 Resum</a>
        <a href="/nou" class="nav-link {% if active_page == 'nou' %}active{% endif %}">➕ Nou Moviment</a>
        <a href="/gasolina" class="nav-link {% if active_page == 'gasolina' %}active{% endif %}">⛽ Gasolina</a>
        <a href="/km" class="nav-link {% if active_page == 'km' %}active{% endif %}">🛣️ Km Cotxe</a>
        <a href="/llista" class="nav-link {% if active_page == 'llista' %}active{% endif %}">📋 Llista Compra</a>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
